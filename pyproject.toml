[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "cdt-solidworks"
version = "0.1.2"
description = "CDT SolidWorks MCP provider"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Trương Công Định (SlncTrZ)" }]
keywords = ["solidworks", "cad", "mcp", "automation", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.9,<5",
  "mcp==2.2.0",
  "mcp-types==2.2.0",
  "pydantic>=2.12,<3",
  "pywin32>=306; sys_platform == 'win32'",
  "starlette>=0.27,<2",
  "uvicorn>=0.52,<1",
]

[project.urls]
Repository = "https://github.com/SlncTrZ/CDT-SolidWorks"
Issues = "https://github.com/SlncTrZ/CDT-SolidWorks/issues"

[project.scripts]
cdt-solidworks = "cdt_solidworks.cli:main"

[project.optional-dependencies]
test = [
  "httpx2>=2.5,<3",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cdt_solidworks", "cdt_solidworks.*"]
namespaces = true

[tool.setuptools.package-data]
"cdt_solidworks.platform" = ["PROVIDER_GUIDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --import-mode=importlib"
