[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "cdt-solidworks"
version = "0.1.0"
description = "CDT SolidWorks MCP provider"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.9,<5",
  "mcp==2.2.0",
  "mcp-types==2.2.0",
  "pydantic>=2.12,<3",
  "starlette>=0.27,<2",
]

[project.optional-dependencies]
test = [
  "httpx2>=2.5,<3",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cdt_solidworks.*"]
namespaces = true

[tool.setuptools.package-data]
"cdt_solidworks.platform" = ["PROVIDER_GUIDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra"
