name: release-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_native:
        description: Run the SOLIDWORKS 2024 native qualification job
        required: true
        default: false
        type: boolean

jobs:
  deterministic-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements/release-py312-linux-x86_64.lock
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m compileall -q src
      - run: git diff --check
      - run: python scripts/release_provenance.py build --manifest dist/release-provenance.json
      - run: python scripts/release_provenance.py verify --manifest dist/release-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-provenance
          path: dist/

  native-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.run_native
    runs-on: [self-hosted, Windows, solidworks-2024]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements/release-py312-windows-amd64.lock
      - shell: pwsh
        run: python -m pip check
      - shell: pwsh
        run: python -m pytest -q
      - shell: pwsh
        run: python scripts/release_provenance.py build --manifest dist/release-provenance.json
      - shell: pwsh
        run: python scripts/release_provenance.py verify --manifest dist/release-provenance.json
      - shell: pwsh
        run: python tests/drawing/native_acceptance_r3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-evidence
          path: |
            dist/
            _private/evidence/native/
